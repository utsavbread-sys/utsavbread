<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(to bottom, #fff5ec, #ffe6d1);
    text-align: center;
}

/* HEADER */
header {
    background: linear-gradient(135deg, #8b4513, #d2691e);
    color: white;
    padding: 25px;
}

/* 🔥 LOGO WHITE GLOW (VISIBLE) */
header img {
    height: 80px;
    animation: glowOutline 1.5s infinite;
}

@keyframes glowOutline {
    0% {
        filter: drop-shadow(0 0 3px #fff)
                drop-shadow(0 0 6px #fff);
    }
    50% {
        filter: drop-shadow(0 0 10px #fff)
                drop-shadow(0 0 20px #fff)
                drop-shadow(0 0 30px #fff);
    }
    100% {
        filter: drop-shadow(0 0 3px #fff)
                drop-shadow(0 0 6px #fff);
    }
}

h1 {
    margin: 5px 0;
}

/* BOX */
.box {
    background: white;
    margin: 20px;
    padding: 20px;
    border-radius: 12px;
}

/* PRODUCTS */
.product-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
    gap: 15px;
}

.product img {
    width:100%;
    border-radius:10px;
}

.product p {
    color:#d2691e;
    font-weight:bold;
}

/* BUTTON */
.whatsapp {
    background:#25D366;
    padding:12px 18px;
    color:white;
    border-radius:8px;
    display:inline-block;
    margin-top:10px;
}

/* FOOTER */
footer {
    background:#222;
    color:white;
    padding:15px;
}
</style>
</head>
